<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/cart.css">
  </head>
  <body>
    <h1 class="section-title">
      Nos Menus
    </h1>
    <div class="container">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card menu-card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1200&auto=format&fit=crop"
            class="card-img-top">
            <div class="card-body">
              <h4 class="card-title">
                Pizza Royale
              </h4>
              <p class="card-text">
                Délicieuse pizza au fromage et viande grillée.
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="price">
                  4500 FCFA
                </span>
                <button class="btn btn-warning add-to-cart" data-name="Pizza Royale" data-price="4500">
                  Ajouter
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card menu-card">
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=1200&auto=format&fit=crop"
            class="card-img-top">
            <div class="card-body">
              <h4 class="card-title">
                Burger Maxi
              </h4>
              <p class="card-text">
                Burger géant avec steak et cheddar fondant.
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="price">
                  3500 FCFA
                </span>
                <button class="btn btn-warning add-to-cart" data-name="Burger Maxi" data-price="3500">
                  Ajouter
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card menu-card">
            <img src="https://images.unsplash.com/photo-1529042410759-befb1204b468?q=80&w=1200&auto=format&fit=crop"
            class="card-img-top">
            <div class="card-body">
              <h4 class="card-title">
                Pâtes Bolognaise
              </h4>
              <p class="card-text">
                Pâtes italiennes avec sauce tomate maison.
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="price">
                  4000 FCFA
                </span>
                <button class="btn btn-warning add-to-cart" data-name="Pâtes Bolognaise" data-price="4000">
                  Ajouter
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="cart-floating">
      <i class="bi bi-cart3"></i>
      <span id="cart-count">
        0
      </span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
